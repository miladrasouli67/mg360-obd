name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip
        run: |
          unzip -o Mg360Obd.zip
          ls -la Mg360Obd
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          cd Mg360Obd
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MG360-OBD-apk
          path: Mg360Obd/app/build/outputs/apk/release/*.apk
